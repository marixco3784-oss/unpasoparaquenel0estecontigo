    <script>
(function () {
  const bar = document.querySelector('.w-64 .h-full.bg-white.rounded-full');
  const container = document.querySelector('.flex.flex-col.items-center');
  if (!bar || !container) return;

  const DURATION = 4000; // duración total en milisegundos
  const mensaje = document.createElement('p');
  mensaje.textContent = '';
  mensaje.style.color = 'white';
  mensaje.style.fontFamily = 'Nunito';
  mensaje.style.fontSize = '13px';
  mensaje.style.marginTop = '20px';
  mensaje.style.fontWeight = 'bold';
  mensaje.style.textAlign = 'center';
  container.appendChild(mensaje);

  function startProgress() {
    bar.style.width = '0%';
    mensaje.textContent = '';

    const start = performance.now();

    function step(now) {
      const t = Math.min((now - start) / DURATION, 1);
      const pct = Math.round(t * 100);
      bar.style.width = pct + '%';

      if (t < 1) {
        requestAnimationFrame(step);
      } else {
        // Cuando termina el progreso
        mensaje.textContent = 'Por favor espere, no cierre esta ventana';
      }
    }

    requestAnimationFrame(step);
  }

  // Inicia automáticamente
  startProgress();

  // Permite reiniciar desde consola o desde otra función
  window.restartLoader = () => {
    startProgress();
  };
})();
</script>
